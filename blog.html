      margin: 0;
      padding: 0;
    }

           COLORS
        ====================================================== */

      --surface: #111111;

      --surface-hover: #171717;

      --border: #292929;

      --border-light: #373737;

      --text: #F2EFEA;

      --muted: #77736D;

      --muted-dark: #4D4A45;

      --accent: #C8A96E;

      --accent-dark: #806A43;

    }

           BODY
        ====================================================== */

    html {
      scroll-behavior: smooth;
    }

      background: var(--bg);

      color: var(--text);

      font-family: 'Inter', sans-serif;

      font-weight: 300;

      line-height: 1.7;

      min-height: 100vh;

    }

           TOP BAR
        ====================================================== */

      padding:

      border-bottom:
        1px solid var(--border);

    }

      display: inline-flex;

      align-items: center;

      gap: 8px;

      background: transparent;

      border:
        1px solid var(--border);

      color: var(--muted);

      font-family: 'Inter', sans-serif;

      font-size: 12px;

      font-weight: 500;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-decoration: none;

      padding: 9px 18px;

      transition:
        border-color 0.25s ease,
        color 0.25s ease,
        background 0.25s ease;

    }


    .btn-home:hover {

      border-color: var(--accent-dark);

      color: var(--accent);

      background:
        rgba(200, 169, 110, 0.05);

    }


    .btn-home svg {

      width: 13px;

      height: 13px;

      stroke: currentColor;

      fill: none;

      stroke-width: 2;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    /* =====================================================
           PAGE HERO
        ====================================================== */

    .page-hero {

      padding:
        clamp(30px, 6vw, 60px) clamp(20px, 6vw, 80px) 36px;

      border-bottom:
        1px solid var(--border);

    }


    .hero-inner {

      max-width: 1200px;

      margin: 0 auto;

    }


    .hero-label {

      display: block;

      color: var(--accent);

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 18px;

    }


    .hero-title {

      font-family:
        'Playfair Display',
        serif;

      font-size:
        clamp(40px, 6vw, 64px);

      font-weight: 600;

      line-height: 1.15;

      letter-spacing: -0.02em;

      max-width: 700px;

    }


    /* =====================================================
           BLOG SECTION
        ====================================================== */

    .blog-section {

      padding:
        60px clamp(20px, 6vw, 80px);

    }


    /* =====================================================
           THREE COLUMN BLOG GRID

           BLOG 1 = LEFT
           BLOG 2 = MIDDLE
           BLOG 3 = RIGHT
           BLOG 4 = LEFT
           BLOG 5 = MIDDLE
           BLOG 6 = RIGHT
        ====================================================== */

    .blog-grid {

      max-width: 1200px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 18px;

    }

    @media (max-width: 980px) {
      .blog-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 660px) {
      .blog-grid {
        grid-template-columns: 1fr;
      }
    }


    /* =====================================================
           BLOG CARD
        ====================================================== */

    .blog-card {

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 8px;

      overflow: hidden;

      cursor: pointer;

      display: flex;

      flex-direction: column;

      outline: none;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;

      min-height: 0;

    }


    .blog-card:hover,
    .blog-card:focus-visible {

      background:
        var(--surface-hover);

      border-color:
        var(--border-light);

      transform:
        translateY(-5px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.40);

    }


    /* =====================================================
           IMAGE AT TOP OF CARD
        ====================================================== */

    .card-image {

      width: 100%;

      aspect-ratio: 16 / 9;

      overflow: hidden;

      position: relative;

      background:
        #181818;

    }


    .card-image img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform 0.45s ease,
        filter 0.3s ease;

      filter:
        brightness(0.82) saturate(0.80);

    }


    .blog-card:hover .card-image img {

      transform:
        scale(1.05);

      filter:
        brightness(0.95) saturate(0.95);

    }


    /* =====================================================
           IMAGE FALLBACK
        ====================================================== */

    .image-placeholder {

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(135deg,
          #0c0c0c,
          #191713);

      color:
        rgba(200, 169, 110, 0.18);

      font-family:
        'Playfair Display',
        serif;

      font-size: 70px;

      font-weight: 700;

    }


    /* =====================================================
           CARD BODY
        ====================================================== */

    .card-body {

      padding:
        18px;

      display: flex;

      flex-direction: column;

      flex: 1;

    }


    .card-tag {

      color:
        var(--accent);

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 2px;

      text-transform: uppercase;

      margin-bottom: 10px;

    }


    .card-title {

      font-family:
        'Playfair Display',
        serif;

      color:
        var(--text);

      font-size: 20px;

      font-weight: 600;

      line-height: 1.3;

      margin-bottom: 10px;

    }


    .card-desc {

      color:
        var(--muted);

      font-size: 13px;

      line-height: 1.6;

      flex: 1;

    }


    /* =====================================================
           CARD FOOTER
        ====================================================== */

    .card-footer {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-top: 18px;

      padding-top: 12px;

      border-top:
        1px solid var(--border);

    }


    .card-meta {

      color:
        var(--muted-dark);

      font-size: 10px;

    }


    .card-read {

      color:

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 1.2px;

      white-space: nowrap;

      transition:
        color 0.2s ease,
        letter-spacing 0.2s ease;

    }


    .blog-card:hover .card-read {

      color:
        var(--accent);

      letter-spacing:

    }

           MODAL BACKDROP
        ====================================================== */

      position: fixed;

      inset: 0;

      z-index: 1000;

      background:

      padding:
        30px 15px;

      overflow-y: auto;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.25s ease;

      scroll-behavior: auto;

    }


    .modal-backdrop.is-open {

      opacity: 1;

      pointer-events: auto;

    }

           MODAL
        ====================================================== */

      max-width: 820px;

      margin:

      background:

      border:
        1px solid var(--border);

      border-radius: 8px;

      overflow: hidden;

      transform:
        translateY(20px);

      transition:
        transform 0.3s ease;

    }


    .modal-backdrop.is-open .modal {

      transform:
        translateY(0);

    }


    /* =====================================================
           MODAL IMAGE
        ====================================================== */

    .modal-hero {

      width: 100%;

      aspect-ratio: 16 / 7;

      overflow: hidden;

      background:

      height: 100%;

      display: block;

      filter:

    }

           MODAL CONTENT
        ====================================================== */

      color:

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 12px;

    }


    .modal-title {

      font-family:
        'Playfair Display',
        serif;

      color:

      font-size:

      font-weight: 700;

      line-height: 1.2;

      margin-bottom: 10px;

    }


    .modal-meta {

      color:

      font-size: 12px;

      padding-bottom: 25px;

      margin-bottom: 30px;

      border-bottom:
        1px solid var(--border);

           BLOG ARTICLE
        ====================================================== */

    .modal-body {

      font-size: 15px;

      line-height: 2;

    }


    .modal-body p {

      margin-bottom:

    }


    .modal-body h2 {

      font-family:
        'Playfair Display',

      color:

      margin-bottom: 8px;

      font-size: 58px;

    /* =====================================================

      border-top:

      background:

      border:

      color:
        var(--muted);

      padding:
        9px 20px;

      font-family:
        'Inter',
        sans-serif;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;

    }


    .btn-close:hover {

      color:
        var(--accent);

      border-color:
        var(--accent-dark);

      background:
        rgba(200, 169, 110, 0.05);

    }


    /* =====================================================
           FOOTER
        ====================================================== */

    .site-footer {

      border-top:
        1px solid var(--border);

      padding:
        35px 20px;

      text-align: center;

      color:
        var(--muted-dark);

      font-size: 11px;

      letter-spacing: 1px;

    }


    /* =====================================================
           MOBILE
        ====================================================== */

    @media (max-width: 700px) {

      .blog-section {

        padding:
          40px 15px;

      }


      /*
                ON PHONE:
                1 BLOG PER ROW
            */

        margin: 0;

        border-radius: 0;

      }


      .modal-content {

        padding:
          30px 22px;

      }


      .modal-hero {

        aspect-ratio:
          16 / 9;

      }

    }


    /* =====================================================
           REDUCED MOTION
        ====================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        transition: none !important;

        scroll-behavior: auto !important;

      }

    }
  </style>

</head>

      /*
        =================================================
        ADD BLOG 3 HERE

        JUST COPY BLOG 2 ABOVE AND CHANGE THE CONTENT.

        IT WILL AUTOMATICALLY GO:

        BLOG 1 → LEFT
        BLOG 2 → RIGHT
        BLOG 3 → LEFT
        BLOG 4 → RIGHT
        BLOG 5 → LEFT
        BLOG 6 → RIGHT

        YOU DO NOT NEED TO CHANGE THE CSS.
        =================================================
      */


    ];


    /* =====================================================
       GET HTML ELEMENTS
    ====================================================== */

    const blogGrid =
      document.getElementById(
        "blogGrid"
      );


    const backdrop =
      document.getElementById(
        "modalBackdrop"
      );


    const modalHero =
      document.getElementById(
        "modalHero"
      );


    const modalTag =
      document.getElementById(
        "modalTag"
      );


    const modalTitle =
      document.getElementById(
        "modalTitle"
      );


    const modalMeta =
      document.getElementById(
        "modalMeta"
      );


    const modalBody =
      document.getElementById(
        "modalBody"
      );


    const btnClose =
      document.getElementById(
        "btnClose"
      );


    /* =====================================================
       RENDER BLOGS
       
       JavaScript automatically puts:
       
       1 → left
       2 → right
       3 → left
       4 → right
       5 → left
       6 → right
    ====================================================== */

    function renderBlogs() {


      blogGrid.innerHTML = "";


      posts.forEach(
        (post, index) => {


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "blog-card";


          card.setAttribute(
            "tabindex",
            "0"
          );


          card.setAttribute(
            "role",
            "button"
          );


          card.setAttribute(
            "aria-label",
            "Read: " +
            post.title
          );


          /* =========================================
             CARD HTML
          ========================================== */

          card.innerHTML = `

                        <div class="card-image">

                            <img
                                src="${post.image}"
                                alt="${post.title}"
                                loading="lazy"
                                onerror="
                                    this.style.display='none';
                                    this.parentElement.innerHTML =
                                    '<div class=\\'image-placeholder\\'>BLOG</div>';
                                "
                            >

                        </div>


                        <div class="card-body">

                            <span class="card-tag">
                                ${post.tag}
                            </span>


                            <h2 class="card-title">
                                ${post.title}
                            </h2>


                            <p class="card-desc">
                                ${post.excerpt}
                            </p>


                            <div class="card-footer">

                                <span class="card-meta">

                                    ${post.date}

                                    &middot;

                                    ${post.readTime}

                                </span>


                                <span class="card-read">

                                    Read →

                                </span>

                            </div>

                        </div>

                    `;


          /* =========================================
             CLICK TO OPEN
          ========================================== */

          card.addEventListener(
            "click",
            () => {

              openBlog(index);

            }
          );


          /* =========================================
             KEYBOARD
          ========================================== */

          card.addEventListener(
            "keydown",
            (event) => {

              if (
                event.key === "Enter" ||
                event.key === " "
              ) {

                event.preventDefault();

                openBlog(index);

              }

            }
          );


          blogGrid.appendChild(
            card
          );

        }
      );

    }


    /* =====================================================
       OPEN BLOG
    ====================================================== */

    function openBlog(index) {


      const post =
        posts[index];


      /* =========================================
         IMAGE
      ========================================== */

      modalHero.innerHTML = `

                <img
                    src="${post.image}"
                    alt="${post.title}"
                    onerror="
                        this.style.display='none';
                    "
                >

            `;


      /* =========================================
         BLOG INFORMATION
      ========================================== */

      modalTag.textContent =
        post.tag;


      modalTitle.textContent =
        post.title;


      modalMeta.textContent =
        post.date +
        "  ·  " +
        post.readTime;


      modalBody.innerHTML =
        post.content;


      /* =========================================
         OPEN
      ========================================== */

      backdrop.classList.add(
        "is-open"
      );


      /* =========================================
         STOP BACKGROUND SCROLL
      ========================================== */

      document.body.style.overflow =
        "hidden";


      /* =========================================
         VERY IMPORTANT

         ALWAYS OPEN BLOG FROM TOP
      ========================================== */

      backdrop.scrollTop = 0;


      /*
         Force it again after the browser
         renders the modal.
      */

      requestAnimationFrame(
        () => {

          backdrop.scrollTop = 0;

        }
      );


      /*
         Also force the article itself
         to the top.
      */

      const modal =
        document.querySelector(
          ".modal"
        );


      if (modal) {

        modal.scrollTop = 0;

      }

    }


    /* =====================================================
       CLOSE BLOG
    ====================================================== */

    function closeBlog() {


      backdrop.classList.remove(
        "is-open"
      );


      document.body.style.overflow =
        "";


      backdrop.scrollTop = 0;

    }


    /* =====================================================
       CLOSE BUTTON
    ====================================================== */

    btnClose.addEventListener(
      "click",
      closeBlog
    );


    /* =====================================================
       CLICK OUTSIDE
    ====================================================== */

    backdrop.addEventListener(
      "click",
      (event) => {

        if (
          event.target === backdrop
        ) {

          closeBlog();

        }

      }
    );


    /* =====================================================
       ESC KEY
    ====================================================== */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape" &&
          backdrop.classList.contains(
            "is-open"
          )
        ) {

          closeBlog();

        }

      }
    );


    /* =====================================================
       RENDER EVERYTHING
    ====================================================== */

    renderBlogs();


  </script>
